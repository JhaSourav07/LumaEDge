<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e222b"/>
      <stop offset="100%" stop-color="#0f1115"/>
    </radialGradient>
    <linearGradient id="edgeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#bgGlow)"/>

  <!-- Screen Perimeter Ring Glow -->
  <rect x="52" y="52" width="408" height="408" rx="76" fill="none" stroke="url(#edgeGlow)" stroke-width="24" opacity="0.4" filter="url(#blurFilter)"/>
  <rect x="52" y="52" width="408" height="408" rx="76" fill="none" stroke="url(#edgeGlow)" stroke-width="12" opacity="0.85"/>

  <!-- Inner Display Aperture -->
  <rect x="88" y="88" width="336" height="336" rx="52" fill="#14161b" stroke="#252932" stroke-width="4"/>

  <!-- Central Virtual Lens Circle -->
  <circle cx="256" cy="256" r="64" fill="#1b1e26" stroke="#38bdf8" stroke-width="6"/>
  <circle cx="256" cy="256" r="32" fill="#38bdf8" opacity="0.8"/>
  <circle cx="244" cy="244" r="8" fill="#ffffff" opacity="0.9"/>
</svg>
